envVarGroups:
  - name: birthday-cron-auth
    envVars:
      - key: BIRTHDAY_CRON_SECRET
        generateValue: true

services:
  - type: web
    name: il-salone-lia-vincenzo
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - fromGroup: birthday-cron-auth
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: il-salone-media
